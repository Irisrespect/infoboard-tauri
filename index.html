<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoBoard</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('infoboard-settings'))
        var t = (s && s.theme) || 'system'
        if (t === 'system') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <!-- 字体自托管（public/fonts），不再依赖 Google Fonts：CSP 保持 font-src 'self' -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
