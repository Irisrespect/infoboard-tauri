[package]
name = "infoboard-tauri"
version = "0.1.0"
description = "InfoBoard - 桌面信息面板"
authors = ["InfoBoard"]
license = "MIT"
edition = "2021"
# 真实最低版本：代码用到 1.80 才稳定的 API（clippy 的 incompatible_msrv 会据此检查）。
# 原先写 1.77 与实际不符；依赖里 keyring 3.6.3 的 MSRV 是 1.75，不冲突。
rust-version = "1.80"

[lib]
name = "infoboard_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
url = "2"
regex = "1"
tokio = { version = "1", features = ["full"] }

tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
md-5 = "0.10"

# Issue 14: 截图插件
image = "0.25"
xcap = "0.4"
arboard = "3"
base64 = "0.22"

# Issue 15: OCR 插件（使用子进程通信，无需额外 crate）

log = "0.4"
chrono = "0.4"
tauri-plugin-single-instance = "2"

# P1-a: 凭据存储（Windows 凭据管理器）。
# 固定 3.6.3：4.x 改了架构（keyring-core + 独立 store crate），且要求 rustc >= 1.88，
# 与 Cargo.toml 声明的 rust-version = "1.77" 不符；3.6.3 的 MSRV 是 1.75。
# 平台后端必须显式开启，windows-native = Windows Credential Manager。
keyring = { version = "=3.6.3", features = ["windows-native"] }
