[package]
name = "infoboard-tauri"
version = "0.8.0"
description = "InfoBoard - 桌面信息面板"
authors = ["InfoBoard"]
license = "MIT"
edition = "2021"
# 真实最低版本：代码用到 1.80 才稳定的 API（clippy 的 incompatible_msrv 会据此检查）。
# 原先写 1.77 与实际不符；依赖里 keyring 3.6.3 的 MSRV 是 1.75，不冲突。
rust-version = "1.80"

[lib]
name = "infoboard_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建开关（Tauri 官方模板同名特性，不要删）。
# tauri 的 build.rs 用 `dev = !custom-protocol` 判断：不启用它，即使
# `cargo build --release` 出来的也是"开发态"二进制——仍然去连 app.devUrl
# （localhost:5173）而不是打包进去的 dist/。`tauri build` 会自动带上这个特性，
# 但直接用 cargo 打包时必须自己加：
#   cargo build --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
url = "2"
regex = "1"
tokio = { version = "1", features = ["full"] }

tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
md-5 = "0.10"

# Issue 14: 截图插件
image = "0.25"
xcap = "0.4"
arboard = "3"
base64 = "0.22"

# Issue 15: OCR 插件（使用子进程通信，无需额外 crate）

log = "0.4"
chrono = "0.4"
tauri-plugin-single-instance = "2"

# P1-a: 凭据存储（Windows 凭据管理器）。
# 固定 3.6.3：4.x 改了架构（keyring-core + 独立 store crate），且要求 rustc >= 1.88，
# 与本文件声明的 rust-version = "1.80" 不符；3.6.3 的 MSRV 是 1.75。
# 平台后端必须显式开启，windows-native = Windows Credential Manager。
keyring = { version = "=3.6.3", features = ["windows-native"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.7.3"

# ─── 构建档位 ───
#
# `pnpm tauri dev` 跑的是 dev 档，而 dev 默认把**依赖也按 O0 编译**。
# 做像素/压缩的库（image、flate2、xcap）在未优化下慢 10~30 倍：
# 实测 2560×1440 截屏 + PNG 编码 —— dev 1.5s，release 80ms。
# 截图/取字"慢"的观感几乎全部来自这里，跟业务代码无关。
#
# 只优化依赖、应用自身仍保持 O0：改业务代码时的增量编译速度不变，
# 代价是首次构建多几分钟（依赖变更时会重编依赖）。
[profile.dev.package."*"]
opt-level = 3
